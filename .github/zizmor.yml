# zizmor configuration - https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      policies:
        # Every action, GitHub's own included, is pinned to a full commit
        # hash with its release tag in a comment (issue #10): a tag can be
        # moved to other code by whoever controls the repository, a commit
        # hash cannot. Dependabot (.github/dependabot.yml) proposes the
        # updates, hash and comment together, as reviewable pull requests.
        '*': hash-pin
