name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  dependency-audit:
    name: Audit dependencies (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-audit-${{ matrix.runner }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: '3.13'
          # Linux environment markers omit MLX; audit its resolved graph on
          # native arm64 macOS as well.
          - runner: macos-15
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # medbench is not installed here; its monitor needs only the stdlib.
      - name: Audit pyproject.toml and docs/requirements.txt
        env:
          PYTHONPATH: src
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          python -m medbench.cli monitor --interval 2 \
            --out "resources/dependency-audit-$RUNNER_LABEL.json" \
            --label "Dependency audit ($RUNNER_LABEL)" -- \
            python scripts/audit_dependencies.py

      # Peak memory, disk and wall time of the step above (issue #9).
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resources-dependency-audit-${{ matrix.runner }}
          path: resources
          if-no-files-found: ignore

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A disabled Dependency graph is a repository setting, not a defect in
      # the pull request: warn and skip the review here; main fails below.
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          DEPENDENCY_GRAPH_MODE: report
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-dependency-graph.sh

      - name: Review dependency changes
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # High-severity transformers 4.49.0 advisories of the pinned
          # UniMedVL runtime, each accepted with its reason in
          # scripts/audit_dependencies.py (REVIEW_ALLOWED_GHSAS); any other
          # advisory still fails the review.
          allow-ghsas: GHSA-29pf-2h5f-8g72, GHSA-fgcw-684q-jj6r, GHSA-x9r9-c232-4q39, GHSA-xrqw-3rrv-vx5w

  # On main and on the weekly scan, a disabled Dependency graph fails with the
  # setting to change, so the skipped pull request reviews do not go unnoticed.
  dependency-graph:
    name: Dependency Graph Enabled
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the dependency graph
        env:
          DEPENDENCY_GRAPH_MODE: require
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-dependency-graph.sh

  # The branch rulesets in .github/rulesets/ are reviewed here but applied by
  # a repository admin (issue #10, docs/repository-policy.md). A pull request
  # only warns; main and the weekly scan fail with the command to run, so an
  # unprotected or drifted default branch cannot go unnoticed. The read-only
  # job token cannot see bypass actors, so those are compared by `apply`.
  rulesets:
    name: Branch Rulesets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Compare live rulesets with .github/rulesets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/repository_rulesets.py check

  # Terminal status gate (issue #69): GitHub reports jobs killed by
  # timeout-minutes as cancelled. Observe every other job so a timeout on main
  # becomes a visible failure instead of a grey run, while a run that was
  # superseded by a newer commit is recognised as expected churn.
  pipeline-status:
    name: Pipeline Status (Security)
    needs:
      - dependency-audit
      - codeql
      - dependency-review
      - dependency-graph
      - rulesets
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
