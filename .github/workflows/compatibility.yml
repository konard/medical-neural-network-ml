name: Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/compatibility.yml'
  # No paths filter on pull requests: "Pipeline Status (Compatibility)" is a
  # required check (.github/rulesets/main-checks.json), and a workflow that a
  # filter skips never reports, which leaves the pull request waiting forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The package still promises 3.9; pipeline scripts use tomllib and
          # require 3.11+, so this entry tests the runtime package only.
          - python: '3.9'
            runner: ubuntu-24.04
            scope: runtime
          - python: '3.12'
            runner: macos-15
            scope: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run compatibility tests without model downloads
        env:
          TEST_SCOPE: ${{ matrix.scope }}
          TEST_BUDGET_SECONDS: 600
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          monitor=(python -m medbench.cli monitor --interval 2
            --out "resources/compatibility-$RUNNER_LABEL.json"
            --label "Compatibility ($RUNNER_LABEL)" --)
          if [ "$TEST_SCOPE" = runtime ]; then
            bash scripts/run-with-budget-warning.sh "$TEST_BUDGET_SECONDS" \
              "Runtime compatibility" "${monitor[@]}" \
              python -m pytest tests/test_medbench*.py tests/test_my_package.py
          else
            bash scripts/run-with-budget-warning.sh "$TEST_BUDGET_SECONDS" \
              "Mac compatibility" "${monitor[@]}" python -m pytest
          fi

      # Peak memory, disk and wall time of the step above (issue #9).
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resources-compatibility-${{ matrix.runner }}
          path: resources
          if-no-files-found: ignore

  pipeline-status:
    name: Pipeline Status (Compatibility)
    needs: [test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
