name: Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/compatibility.yml'
  # No paths filter on pull requests: "Pipeline Status (Compatibility)" is a
  # required check (.github/rulesets/main-checks.json), and a workflow that a
  # filter skips never reports, which leaves the pull request waiting forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every Python minor in pyproject.toml's classifiers runs the full
        # suite, starting at the requires-python floor: 3.11-3.14 on Linux
        # here and 3.15 on Linux in release.yml. arm64 macOS runs 3.15, the
        # newest Python with MLX wheels; setup-python has no macOS build of
        # a 3.12 security release after 3.12.10 (issue #19).
        include:
          - python: '3.11'
            runner: ubuntu-26.04
          - python: '3.12'
            runner: ubuntu-26.04
          - python: '3.13'
            runner: ubuntu-26.04
          - python: '3.14'
            runner: ubuntu-26.04
          - python: '3.15'
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run compatibility tests without model downloads
        env:
          TEST_BUDGET_SECONDS: 600
          RUN_LABEL: ${{ matrix.runner }}-py${{ matrix.python }}
        run: |
          bash scripts/run-with-budget-warning.sh "$TEST_BUDGET_SECONDS" \
            "Compatibility ($RUN_LABEL)" \
            python -m medbench.cli monitor --interval 2 \
            --out "resources/compatibility-$RUN_LABEL.json" \
            --label "Compatibility ($RUN_LABEL)" -- \
            python -m pytest

      # Peak memory, disk and wall time of the step above (issue #9).
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resources-compatibility-${{ matrix.runner }}-py${{ matrix.python }}
          path: resources
          if-no-files-found: ignore

  pipeline-status:
    name: Pipeline Status (Compatibility)
    needs: [test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
