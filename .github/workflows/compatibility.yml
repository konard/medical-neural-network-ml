name: Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/compatibility.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The package still promises 3.9; pipeline scripts use tomllib and
          # require 3.11+, so this entry tests the runtime package only.
          - python: '3.9'
            runner: ubuntu-24.04
            scope: runtime
          - python: '3.12'
            runner: macos-15
            scope: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run compatibility tests without model downloads
        env:
          TEST_SCOPE: ${{ matrix.scope }}
          TEST_BUDGET_SECONDS: 600
        run: |
          if [ "$TEST_SCOPE" = runtime ]; then
            bash scripts/run-with-budget-warning.sh "$TEST_BUDGET_SECONDS" \
              "Runtime compatibility" \
              python -m pytest tests/test_medbench*.py tests/test_my_package.py
          else
            bash scripts/run-with-budget-warning.sh "$TEST_BUDGET_SECONDS" \
              "Mac compatibility" python -m pytest
          fi

  pipeline-status:
    name: Pipeline Status
    needs: [test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
