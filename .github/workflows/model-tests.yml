name: Model Tests

# Runs real medical models on the tasks of issue #1. The images and documents
# are real, openly licensed files (src/medbench/data/real_samples.json) that
# are downloaded here and checked by SHA-256; none are stored in the repository.
#
# real-data   Downloads every real sample, checks hash and license list, and
#             writes ATTRIBUTION.md. Pull requests reuse the cached files (the
#             hash is still checked), so CI does not load Wikimedia on every
#             push; the weekly run skips the cache to catch moved files.
# cpu-smoke   MedGemma 4B (4-bit) on a GitHub-hosted runner. It proves that
#             download, serving, images and scoring work end to end; a few
#             items take about 10-20 minutes because CPU decoding is slow.
# ocr-baseline Classic Tesseract OCR on every real OCR sample, the specialist
#             baseline the VLM OCR scores are compared with (issue #7).
# gpu         MedGemma 4B or 27B (llama.cpp) or UniMedVL (its own PyTorch code
#             behind scripts/unimedvl_server.py) on a self-hosted runner with an
#             NVIDIA GPU and the labels `self-hosted, linux, x64, gpu`. It only
#             runs when someone with write access starts the workflow by hand,
#             so pull requests from forks can never reach that machine.
#             Setup: docs/case-studies/issue-1/ci-and-gpu-runner.md.
#
# Model downloads and runs go through `medbench monitor`, which writes
# medbench-reports/resources-*.json: peak GPU and host memory, free disk,
# driver and CUDA versions and wall time (issues #6 and #9).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Every file the jobs below run or install from (issue #4).
    paths:
      - 'src/medbench/**'
      - 'scripts/medbench-model-run.sh'
      - 'scripts/run-with-budget-warning.sh'
      - 'scripts/unimedvl_server.py'
      - 'scripts/unimedvl-requirements.in'
      - 'scripts/unimedvl-requirements.txt'
      - 'tests/test_real_models.py'
      - 'tests/test_medbench_real_data.py'
      - 'pyproject.toml'
      - '.github/workflows/model-tests.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Items per task'
        type: number
        default: 2
      gpu:
        description: 'Also run on the self-hosted GPU runner'
        type: boolean
        default: false
      gpu-model:
        description: 'Model for the GPU job'
        type: choice
        options:
          - medgemma-27b-it
          - medgemma-4b-it
          - unimedvl
        default: medgemma-27b-it

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  real-data:
    name: Real sample files
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: model-${{ github.workflow }}-${{ github.ref }}-real-data
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      MEDBENCH_DATA_DIR: .cache/medbench-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install medbench
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore real sample cache
        if: github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/medbench-data
          key: medbench-data-${{ hashFiles('src/medbench/data/real_samples.json') }}

      - name: Download and verify every real sample
        env:
          MEDBENCH_NETWORK_TESTS: '1'
        run: |
          mkdir -p "$MEDBENCH_DATA_DIR"
          python -m medbench.cli monitor --out resources/real-data-fetch.json \
            --label "Download real samples" --interval 2 \
            --disk "$MEDBENCH_DATA_DIR" -- \
            python -m medbench.cli fetch --out "$MEDBENCH_DATA_DIR"
          python -m medbench.cli monitor --out resources/real-data-verify.json \
            --label "Verify real samples" --interval 2 -- \
            pytest -m network tests/test_medbench_real_data.py

      - name: Upload attribution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medbench-real-data-attribution
          path: .cache/medbench-data/ATTRIBUTION.md
          if-no-files-found: ignore

      # Peak memory, disk and wall time of the step above (issue #9).
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resources-real-data
          path: resources
          if-no-files-found: ignore

  cpu-smoke:
    name: CPU smoke test (MedGemma 4B Q4_K_M)
    if: github.event_name != 'schedule'
    needs: real-data
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    concurrency:
      group: model-${{ github.workflow }}-${{ github.ref }}-cpu-smoke
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install medbench
        env:
          INSTALL_BUDGET_SECONDS: 300
        run: |
          bash scripts/run-with-budget-warning.sh \
            "$INSTALL_BUDGET_SECONDS" "Install medbench" \
            bash -euo pipefail -c '
              python -m pip install --upgrade pip
              pip install -e ".[dev]"
            '

      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/medbench
          key: medbench-cpu-${{ hashFiles('scripts/medbench-model-run.sh') }}

      - name: Restore real sample cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/medbench-data
          key: medbench-data-${{ hashFiles('src/medbench/data/real_samples.json') }}

      - name: Download and verify model
        env:
          DOWNLOAD_BUDGET_SECONDS: 600
        run: |
          bash scripts/run-with-budget-warning.sh \
            "$DOWNLOAD_BUDGET_SECONDS" "Download model" \
            python -m medbench.cli monitor --out medbench-reports/resources-download.json \
            --label "Download model" -- \
            bash scripts/medbench-model-run.sh download

      - name: Run medical tasks on real samples
        env:
          MEDBENCH_DATA_DIR: .cache/medbench-data
          MEDBENCH_BUDGET_SECONDS: 1500
          TIME_BUDGET: 1200
          COUNT: ${{ inputs.count || 2 }}
          TASKS: diagnosis-ddxplus imaging-xray ocr-prescription
          OUT_DIR: medbench-reports
        run: |
          bash scripts/run-with-budget-warning.sh \
            "$MEDBENCH_BUDGET_SECONDS" "Run medbench" \
            python -m medbench.cli monitor --out "$OUT_DIR/resources-run.json" \
            --label "Run medbench" -- \
            bash scripts/medbench-model-run.sh run

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medbench-cpu-reports
          path: medbench-reports
          if-no-files-found: ignore

  ocr-baseline:
    name: OCR baseline (Tesseract)
    needs: real-data
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: model-${{ github.workflow }}-${{ github.ref }}-ocr-baseline
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install Tesseract and medbench
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          tesseract --version
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore real sample cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/medbench-data
          key: medbench-data-${{ hashFiles('src/medbench/data/real_samples.json') }}

      - name: Score Tesseract on every real OCR sample
        env:
          MEDBENCH_DATA_DIR: .cache/medbench-data
        run: |
          mkdir -p medbench-reports
          tesseract --version > medbench-reports/tesseract-version.txt 2>&1
          for task in ocr-prescription ocr-history; do
            count=$(python -m medbench.cli sources --task "$task" \
              | python -c 'import json, sys; print(len(json.load(sys.stdin)))')
            python -m medbench.cli monitor --interval 2 \
              --out "medbench-reports/resources-tesseract-$task.json" \
              --label "Tesseract $task" -- \
              python -m medbench.cli run --task "$task" --backend tesseract \
              --count "$count" --time-budget 600 \
              --out "medbench-reports/tesseract-$task.json"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medbench-ocr-baseline-reports
          path: medbench-reports
          if-no-files-found: ignore

  # Self-hosted runner policy (issue #10, docs/repository-policy.md): only a
  # manual dispatch from main reaches the GPU host, never a pull request or a
  # branch whose workflow file someone else could have edited. The `gpu`
  # environment is where the maintainer adds required reviewers. Register the
  # runner with --ephemeral on a fresh VM; the last step below also removes
  # the downloaded weights, the model venv and the reports from the workspace
  # in case the host is reused.
  gpu:
    name: GPU tests (self-hosted)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.gpu &&
      github.ref == 'refs/heads/main'
    environment: gpu
    runs-on: [self-hosted, linux, x64, gpu]
    # The case study estimates roughly 51 minutes for 27B. Reserve 90 minutes
    # for tasks, plus download/setup and time to upload partial evidence.
    timeout-minutes: 210
    concurrency:
      group: model-${{ github.workflow }}-gpu
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      LLAMA_ARCHIVE: llama-b11707-bin-ubuntu-cuda-12.8-x64.tar.gz
      LLAMA_SHA256: 208d228a2e752b91ebb15717f9116915a1704f2af644ee278d4b4d7911199e6a
      CUDART_ARCHIVE: cudart-llama-b11707-bin-ubuntu-cuda-12.8-x64.tar.gz
      CUDART_SHA256: a0698562c748ea4ffcf2631f13ca1429c3b794e67272066053c21c607ade5ebf
      GPU_LAYERS: 999
      GPU_MODEL: ${{ inputs.gpu-model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # UniMedVL's pinned PyTorch stack needs Python 3.10 (upstream
      # environment.yaml); medbench itself runs on 3.15.
      - name: Setup Python 3.10 for UniMedVL
        id: unimedvl-python
        if: inputs.gpu-model == 'unimedvl'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Show GPU
        run: nvidia-smi

      - name: Select model
        env:
          UNIMEDVL_PYTHON: ${{ steps.unimedvl-python.outputs.python-path }}
        run: |
          case "$GPU_MODEL" in
            medgemma-27b-it)
              {
                echo "MODEL_REPO=unsloth/medgemma-27b-it-GGUF"
                echo "MODEL_REVISION=c56c561dd4fcb1b57bc64cd75cc8f728eb5befcd"
                echo "MODEL_FILE=medgemma-27b-it-Q4_K_M.gguf"
                echo "MODEL_SHA256=89fdb77fd378f4e4f7f1ed2bb349c8cb0784f354970736758368f9d3cc7449c3"
                echo "MMPROJ_FILE=mmproj-F16.gguf"
                echo "MMPROJ_SHA256=9c7733e3ced596d4e05b890ca66622fed129716c4a23e7feff66528416a5b0e0"
              } >> "$GITHUB_ENV"
              ;;
            medgemma-4b-it)
              echo "Using the script defaults (MedGemma 4B Q4_K_M)."
              ;;
            unimedvl)
              {
                echo "SERVER=unimedvl"
                echo "UNIMEDVL_PYTHON=$UNIMEDVL_PYTHON"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown model '$GPU_MODEL'."
              exit 1
              ;;
          esac

      - name: Install medbench
        env:
          INSTALL_BUDGET_SECONDS: 300
        run: |
          bash scripts/run-with-budget-warning.sh \
            "$INSTALL_BUDGET_SECONDS" "Install medbench" \
            bash -euo pipefail -c '
              python -m pip install --upgrade pip
              pip install -e ".[dev]"
            '

      - name: Download and verify model
        env:
          DOWNLOAD_BUDGET_SECONDS: 2400
        run: |
          bash scripts/run-with-budget-warning.sh \
            "$DOWNLOAD_BUDGET_SECONDS" "Download model" \
            python -m medbench.cli monitor --out medbench-reports/resources-download.json \
            --label "Download model" -- \
            bash scripts/medbench-model-run.sh download

      - name: Run medical tasks on real samples
        env:
          MEDBENCH_BUDGET_SECONDS: 5700
          TIME_BUDGET: 5400
          COUNT: ${{ inputs.count || 20 }}
          TASKS: >-
            diagnosis diagnosis-ddxplus ocr-prescription ocr-history
            imaging-xray imaging-mri imaging-ultrasound
          OUT_DIR: medbench-reports
        run: |
          bash scripts/run-with-budget-warning.sh \
            "$MEDBENCH_BUDGET_SECONDS" "Run medbench" \
            python -m medbench.cli monitor --out "$OUT_DIR/resources-run.json" \
            --label "Run medbench" -- \
            bash scripts/medbench-model-run.sh run

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medbench-gpu-reports
          path: medbench-reports
          if-no-files-found: ignore

      - name: Remove downloads and reports from the GPU host
        if: always()
        run: rm -rf .cache/medbench medbench-reports

  # Terminal status gate (issue #69): GitHub reports jobs killed by
  # timeout-minutes as cancelled. Observe every other job so a timeout on main
  # becomes a visible failure instead of a grey run, while a run that was
  # superseded by a newer commit is recognised as expected churn.
  pipeline-status:
    name: Pipeline Status (Model Tests)
    needs:
      - real-data
      - cpu-smoke
      - ocr-baseline
      - gpu
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
